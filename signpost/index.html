<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BrandCloud prototypes</title>
<link rel="icon" href="/ds/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/base.css">
<link rel="stylesheet" href="/ds/components.css">
<style>
  body{min-height:100vh}
  .wrap{max-width:880px;margin:0 auto;padding:var(--sp-2xl) var(--sp-l) var(--sp-4xl)}
  .top{display:flex;align-items:center;gap:var(--sp-m);margin-bottom:var(--sp-3xl)}
  .top .logo{display:block;flex:none;color:var(--text-primary)}
  .top h1{font:var(--t-h5);flex:1;padding-left:var(--sp-m);border-left:1px solid var(--border-light)}
  #logout .who{color:var(--text-tertiary);font-weight:400}
  .top small{display:block;font:var(--t-cap);color:var(--text-tertiary);margin-top:2px}

  .full{display:flex;align-items:center;gap:var(--sp-l);padding:var(--sp-xl);text-decoration:none;color:inherit;
        background:linear-gradient(135deg,var(--surface-action-light),var(--surface-primary) 70%);border:1px solid var(--border-subtle);border-radius:var(--r-xl);box-shadow:var(--shadow-md);transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
  .full:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
  .full__ic{color:var(--icon-action);flex:none;width:56px;height:56px;border-radius:var(--r-l);display:grid;place-items:center;background:var(--surface-primary);box-shadow:var(--shadow-sm)}
  .full__t{flex:1;min-width:0}
  .full__t h2{font:var(--t-h4)}
  .full__t p{font:var(--t-body-s);color:var(--text-secondary);margin-top:var(--sp-2xs)}
  .full__go{flex:none}

  .bar{display:flex;align-items:center;gap:var(--sp-m);margin:var(--sp-3xl) 0 var(--sp-m)}
  .bar h2{font:var(--t-h6);flex:1}
  .bar h2 span{color:var(--text-tertiary);font-weight:600;margin-left:var(--sp-2xs)}

  .list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--sp-s)}
  .row{position:relative;display:flex;align-items:center;gap:var(--sp-m);padding:var(--sp-m) var(--sp-m) var(--sp-m) var(--sp-l);background:var(--surface-primary);border:1px solid var(--border-subtle);border-radius:var(--r-l);transition:border-color .15s var(--ease)}
  .row:hover{border-color:var(--border-light)}
  .row__t{flex:1;min-width:0}
  .row__t a{font:var(--t-body-b);color:var(--text-primary);text-decoration:none}
  .row__t a::after{content:"";position:absolute;inset:0;border-radius:inherit}
  .row__t a:focus-visible{outline:none}
  .row:has(a:focus-visible){outline:2px solid var(--border-action);outline-offset:2px}
  .row__t p{font:var(--t-body-s);color:var(--text-secondary);margin-top:2px}
  .row__m{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-xs);margin-top:var(--sp-xs);font:var(--t-cap);color:var(--text-tertiary)}
  .row__acts{position:relative;z-index:1;display:flex;gap:var(--sp-2xs)}
  .row__acts .bc-btn{color:var(--icon-secondary)}
  .seg{display:inline-flex;padding:2px;border:1px solid var(--border-light);border-radius:var(--r-s);background:var(--surface-primary)}
  .seg button{height:30px;padding:0 var(--sp-s);border:0;border-radius:var(--r-xs);background:transparent;color:var(--text-tertiary);font:var(--t-body-s-b)}
  .seg button[aria-pressed="true"]{background:var(--surface-tertiary);color:var(--text-primary)}
  .top .bc-btn{text-decoration:none}
  .empty{padding:var(--sp-2xl);text-align:center;color:var(--text-tertiary);font:var(--t-body-s)}
  .foot{margin-top:var(--sp-3xl);font:var(--t-cap);color:var(--text-tertiary);text-align:center}
  .top>*{min-width:0}
  @media (max-width:560px){
    .full{flex-wrap:wrap} .full__go{width:100%} .row__t p{display:none}
    .wrap{padding-top:var(--sp-l)}
    .top{gap:var(--sp-xs);margin-bottom:var(--sp-xl)}
    .top .logo{width:72px;height:auto}
    .top h1{padding-left:var(--sp-s);font:var(--t-h6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top small{display:none}
    #logout>span{display:none}
    #upload{padding:0 var(--sp-s)}
    .bar{flex-wrap:wrap}
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <img class="logo" src="/ds/logo.svg" width="150" height="32" alt="BrandCloud">
    <h1>Prototypes<small>BrandCloud · clickable design prototypes</small></h1>
    <a class="bc-btn bc-btn--secondary bc-btn--s" id="upload" href="/_sv/admin.php" hidden>Upload</a>
    <a class="bc-btn bc-btn--ghost bc-btn--s" href="/catalog/">Component catalogue</a>
    <a class="bc-btn bc-btn--ghost bc-btn--s" id="logout" href="/_sv/logout.php" hidden></a>
  </header>

  <div id="full"></div>

  <div class="bar">
    <h2 id="listH">Individual prototypes<span id="count"></span></h2>
    <div class="seg" role="group" aria-labelledby="listH" id="sort">
      <button type="button" data-sort="added" aria-pressed="true">Last added</button>
      <button type="button" data-sort="az" aria-pressed="false">A–Z</button>
    </div>
  </div>
  <ul class="list" id="list" aria-live="polite"></ul>
  <p class="foot" id="foot"></p>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON = {
  copy:'<path d="M9 9h10v10H9z"/><path d="M5 15V5h10"/>', ok:'<path d="M5 12l4 4 10-10"/>',
  figma:'<path d="M9 3h3v6H9a3 3 0 0 1 0-6zM12 3h3a3 3 0 0 1 0 6h-3zM9 9h3v6H9a3 3 0 0 1 0-6zM15 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM9 15h3v3a3 3 0 1 1-3-3z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>', arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  upload:'<path d="M12 15V4M7 9l5-5 5 5M5 20h14"/>', logout:'<path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M14 16l4-4-4-4M18 12H9"/>',
  mobile:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>', desktop:'<rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 20.5h8M12 17v3.5"/>'
};
const ic = (k, s = 18) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
const fmtDate = d => new Date(d).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
let SORT = 'added', ITEMS = [];
try { SORT = localStorage.getItem('bc-sort') || 'added'; } catch (e) {}


const actions = p => `<div class="row__acts">
  ${p.figma ? `<a class="bc-btn bc-btn--ghost bc-btn--icon bc-btn--s" href="${esc(p.figma)}" target="_blank" rel="noopener" aria-label="${esc(p.title)} in Figma" title="Open in Figma">${ic('figma')}</a>` : ''}
  <button class="bc-btn bc-btn--ghost bc-btn--icon bc-btn--s" type="button" data-copy="${esc(p.url)}" aria-label="Copy link to ${esc(p.title)}" title="Copy link">${ic('copy')}</button></div>`;

function render() {
  const full = ITEMS.find(p => p.pinned);
  $('#full').innerHTML = full ? `<a class="full" href="${esc(full.url)}">
      <span class="full__ic">${ic(full.device === 'desktop' ? 'desktop' : 'mobile', 28)}</span>
      <span class="full__t"><h2>${esc(full.title)}</h2><p>${esc(full.description)}</p></span>
      <span class="full__go bc-btn bc-btn--primary">Open ${ic('arrow', 16)}</span></a>` : '';
  const rest = ITEMS.filter(p => !p.pinned).sort(SORT === 'az' ? (a, b) => a.title.localeCompare(b.title) : (a, b) => (new Date(b.added) - new Date(a.added)) || a.title.localeCompare(b.title));
  $('#count').textContent = rest.length;
  $('#list').innerHTML = rest.length ? rest.map(p => `<li class="row">
      <div class="row__t"><a href="${esc(p.url)}">${esc(p.title)}</a>${p.description ? `<p>${esc(p.description)}</p>` : ''}
        <div class="row__m">${p.device ? `${ic(p.device === 'desktop' ? 'desktop' : 'mobile', 14)}<span>${p.device === 'desktop' ? 'Desktop' : 'Mobile'}</span><span aria-hidden="true">·</span>` : `${ic('upload', 14)}<span>Uploaded</span><span aria-hidden="true">·</span>`}<span>Added ${esc(fmtDate(p.added))}</span>${p.state === 'main' ? '<span class="bc-badge bc-badge--success">In Main</span>' : '<span class="bc-badge bc-badge--warning">Standalone</span>'}</div></div>
      ${actions(p)}</li>`).join('') : '<li class="empty">No prototypes yet.</li>';
  document.querySelectorAll('#sort button').forEach(b => b.setAttribute('aria-pressed', b.dataset.sort === SORT));
}

$('#sort').onclick = e => { const b = e.target.closest('button'); if (!b) return; SORT = b.dataset.sort; try { localStorage.setItem('bc-sort', SORT); } catch (_) {} render(); };
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const url = location.origin + b.dataset.copy;
  const done = () => { b.innerHTML = ic('ok'); setTimeout(() => { b.innerHTML = ic('copy'); }, 1500); };
  navigator.clipboard ? navigator.clipboard.writeText(url).then(done, () => prompt('Copy link', url)) : prompt('Copy link', url);
});

const api = fetch('/_sv/api.php', {cache:'no-store', credentials:'same-origin'}).then(r => r.ok ? r.json() : null).catch(() => null);
Promise.all([fetch('/manifest.json', {cache:'no-store'}).then(r => r.json()), api]).then(([m, a]) => {
  ITEMS = m.prototypes.concat(a && a.uploads ? a.uploads.map(u => ({...u, state:'standalone', device:''})) : []);
  if (a && a.role) { $('#logout').hidden = false; $('#logout').innerHTML = `${ic('logout', 18)}<span>Log out <span class="who">(${esc(a.role)})</span></span>`; $('#upload').hidden = a.role !== 'admin'; }
  render();
  $('#foot').textContent = `Last deploy ${new Date(m.builtAt).toLocaleString('en-GB', {dateStyle:'medium', timeStyle:'short'})}`;
}).catch(() => { $('#list').innerHTML = '<li class="empty">Could not load the prototype list.</li>'; });
</script>
</body>
</html>
